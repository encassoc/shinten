<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>shinten デモ</title>
<style>
body { margin:0; height:100vh; display:grid; place-items:center; background:#fff; font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; color:#1d2433; }
.c { text-align:center; } img { height:104px; } .rule { width:84px; height:4px; margin:22px auto; border-radius:2px; background:linear-gradient(90deg,#1b3a8c,#1f6fd6,#3fb6ea); }
h1 { font-size:34px; line-height:1.45; margin:0 0 12px; font-weight:700; } p { margin:0; color:#5b6475; font-size:16px; line-height:1.8; }
.tag { display:inline-block; margin-top:16px; font-size:13px; color:#5b6475; border:1px solid #dfe3ea; border-radius:999px; padding:2px 14px; }
.foot { position:fixed; bottom:22px; left:0; right:0; text-align:center; font-size:12px; color:#9aa2b1; }
</style></head>
<body><div class="c"><img src="/logo.png" alt="shinten"><div class="rule"></div><h1 id="h"></h1><p id="p"></p><div class="tag" id="t"></div></div><div class="foot">このデモに登場する店舗・人物・住所はすべて架空です</div>
<script>
const q = new URLSearchParams(location.search);
const cards = {
  start: ['Webフォームの個人情報を、<br>公開領域に残さない', '入力の瞬間に暗号化し、使う人の端末でだけ復号する', 'shinten ／ shinten-ship ／ deedlog（オープンソース）'],
  end: ['漏れても読めない形で預かり、<br>取り扱いを証明できる', '公開領域には暗号文だけ。復号は業務の場所だけ。<br>その記録は、第三者が確かめられる', 'shinten.dev'],
};
const [h, p, t] = cards[q.get('card') ?? 'start'];
document.getElementById('h').innerHTML = h; document.getElementById('p').innerHTML = p; document.getElementById('t').textContent = t;
</script></body></html>
